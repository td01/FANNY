<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fanny — Football Fan Debater</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:ital,wght@0,300;0,400;0,700;0,900;1,300;1,400;1,700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --c1:#1a1f2e;
  --c2:#252b3d;
  --accent:#e8b84b;
  --text:#f0ede4;
  --muted:rgba(240,237,228,0.45);
  --pulse:#e8b84b;
  --transition:1.2s;
}

html,body{height:100%;overflow:hidden;background:var(--c1);color:var(--text);font-family:'Barlow',sans-serif}

/* ── BACKGROUND ── */
#bg{
  position:fixed;inset:0;z-index:0;
  background:radial-gradient(ellipse at 30% 50%, var(--c2) 0%, var(--c1) 70%);
  transition:background var(--transition) ease;
}

/* pitch lines */
#bg::after{
  content:'';position:absolute;inset:0;
  background-image:
    repeating-linear-gradient(0deg,transparent,transparent 60px,rgba(255,255,255,.025) 60px,rgba(255,255,255,.025) 61px);
  pointer-events:none;
}

/* ── LOGO ── */
.logo{
  position:fixed;top:24px;left:32px;z-index:10;
  font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:3px;
  color:var(--accent);opacity:.7;
  transition:color var(--transition);
}

/* ── COUNTRY FLAG STRIP ── */
.country-strip{
  position:fixed;top:20px;right:28px;z-index:10;
  display:flex;align-items:center;gap:10px;
  opacity:0;transition:opacity .6s;
}
.country-strip.show{opacity:1}
.country-flag{font-size:28px;line-height:1}
.country-name{
  font-size:13px;font-weight:700;letter-spacing:2px;text-transform:uppercase;
  color:var(--accent);transition:color var(--transition);
}

/* ── FANNY ORB ── */
#fannyWrap{
  position:fixed;
  left:50%;top:50%;
  transform:translate(-50%,-60%);
  z-index:5;
  display:flex;flex-direction:column;align-items:center;
  transition:transform .8s cubic-bezier(.34,1.56,.64,1);
}
#fannyWrap.talking{transform:translate(-50%,-65%)}
#fannyWrap.listening{transform:translate(-50%,-58%)}

#fannyOrb{
  position:relative;
  width:200px;height:200px;
  display:flex;align-items:center;justify-content:center;
}
#orbCanvas{position:absolute;inset:0;border-radius:50%}
#fannyInitial{
  position:relative;z-index:2;
  font-family:'Bebas Neue',sans-serif;
  font-size:80px;letter-spacing:4px;
  color:var(--accent);
  opacity:.9;
  transition:color var(--transition);
  user-select:none;
}

#moodLabel{
  margin-top:12px;
  font-family:'Bebas Neue',sans-serif;font-size:15px;letter-spacing:3px;
  color:var(--accent);opacity:.7;
  transition:all .4s;text-align:center;
}

/* ── PULSE RING ── */
#pulseRing{
  position:fixed;
  left:50%;top:50%;
  transform:translate(-50%,-60%);
  width:180px;height:180px;
  border-radius:50%;
  border:2px solid var(--accent);
  opacity:0;
  pointer-events:none;
  z-index:4;
  transition:border-color var(--transition);
}

#pulseRing.active{animation:ringpulse 1.4s infinite ease-out}
#pulseRing.listen{animation:ringpulse 2s infinite ease-out;border-color:rgba(255,255,255,.3)}

@keyframes ringpulse{
  0%{transform:translate(-50%,-60%) scale(1);opacity:.7}
  100%{transform:translate(-50%,-60%) scale(2.2);opacity:0}
}

/* ── SPEECH TEXT ── */
#speechArea{
  position:fixed;
  left:0;right:0;
  z-index:6;
  display:flex;flex-direction:column;
  align-items:center;
  pointer-events:none;
}

/* Fanny's speech — above face */
#fannyText{
  position:fixed;
  left:10%;right:10%;
  top:8vh;
  text-align:center;
  font-size:clamp(18px,3vw,32px);
  font-weight:300;
  font-style:italic;
  line-height:1.4;
  color:var(--text);
  opacity:0;
  transform:translateY(-10px);
  transition:opacity .5s,transform .5s;
  pointer-events:none;
  z-index:6;
}
#fannyText.show{opacity:1;transform:translateY(0)}

/* User speech — below face */
#userText{
  position:fixed;
  left:10%;right:10%;
  bottom:120px;
  text-align:center;
  font-size:clamp(16px,2.5vw,26px);
  font-weight:700;
  letter-spacing:1px;
  color:var(--accent);
  opacity:0;
  transform:translateY(10px);
  transition:opacity .4s,transform .4s;
  pointer-events:none;
  z-index:6;
  transition:color var(--transition);
}
#userText.show{opacity:1;transform:translateY(0)}
#userText.interim{opacity:.6;font-style:italic}

/* ── STATUS BAR ── */
#statusBar{
  position:fixed;bottom:0;left:0;right:0;
  height:64px;z-index:10;
  display:flex;align-items:center;justify-content:center;gap:16px;
  background:rgba(0,0,0,.3);
  backdrop-filter:blur(10px);
  border-top:1px solid rgba(255,255,255,.06);
}

#statusDot{
  width:8px;height:8px;border-radius:50%;
  background:rgba(255,255,255,.2);
  flex-shrink:0;transition:background .3s;
}
#statusDot.ready{background:#22c55e}
#statusDot.listen{background:var(--accent);animation:dotpulse .8s infinite;transition:background var(--transition)}
#statusDot.think{background:#a78bfa;animation:dotpulse 1.2s infinite}
#statusDot.speak{background:#60a5fa;animation:dotpulse 1s infinite}
@keyframes dotpulse{0%,100%{opacity:1}50%{opacity:.3}}

#statusMsg{
  font-size:12px;letter-spacing:2px;text-transform:uppercase;
  color:rgba(255,255,255,.4);
  min-width:160px;text-align:center;
}

/* interrupt button */
#interruptBtn{
  position:fixed;bottom:80px;right:28px;z-index:11;
  width:44px;height:44px;border-radius:50%;
  border:1px solid rgba(255,255,255,.15);
  background:rgba(0,0,0,.4);
  color:rgba(255,255,255,.4);
  font-size:18px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  opacity:0;transition:opacity .3s;
}
#interruptBtn.show{opacity:1}
#interruptBtn:hover{background:rgba(255,255,255,.1);color:white}

/* ── WAVEFORM CANVAS ── */
#waveCanvas{
  width:120px;height:32px;
  opacity:0;transition:opacity .4s;
}
#waveCanvas.active{opacity:1}

/* ── ERROR ── */
#errMsg{
  position:fixed;top:60px;left:50%;transform:translateX(-50%);
  background:rgba(180,30,30,.9);border-radius:8px;
  padding:8px 20px;font-size:13px;color:white;
  z-index:20;display:none;
  max-width:80%;text-align:center;
}

/* ── INTRO OVERLAY ── */
#intro{
  position:fixed;inset:0;z-index:50;
  background:var(--c1);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:16px;transition:opacity .8s;
}
#intro.fade{opacity:0;pointer-events:none}

.intro-logo{
  font-family:'Bebas Neue',sans-serif;font-size:72px;letter-spacing:8px;
  color:var(--accent);line-height:1;
}
.intro-sub{font-size:14px;letter-spacing:3px;color:var(--muted);text-transform:uppercase}
.intro-btn{
  margin-top:24px;
  padding:14px 40px;
  border:2px solid var(--accent);border-radius:40px;
  background:transparent;color:var(--accent);
  font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:3px;
  cursor:pointer;transition:all .2s;
}
.intro-btn:hover{background:var(--accent);color:#0a0f1e}
.intro-note{font-size:11px;color:var(--muted);letter-spacing:1px;margin-top:8px}
</style>
</head>
<body>

<div id="bg"></div>

<!-- INTRO -->
<div id="intro">
  <div class="intro-logo">Fanny</div>
  <div class="intro-sub">World Cup 2026 · Fan Debater</div>
  <button class="intro-btn" id="startBtn">Start the Debate</button>
  <div class="intro-note">Allow microphone access when asked</div>
</div>

<!-- MAIN UI -->
<div class="logo">FANNY ⚽</div>

<div class="country-strip" id="countryStrip">
  <div class="country-flag" id="countryFlag"></div>
  <div class="country-name" id="countryName"></div>
</div>

<!-- Pulse ring behind face -->
<div id="pulseRing"></div>

<!-- Fanny orb -->
<div id="fannyWrap">
  <div id="fannyOrb">
    <canvas id="orbCanvas" width="200" height="200"></canvas>
    <div id="fannyInitial">F</div>
  </div>
  <div id="moodLabel">Ready…</div>
</div>

<!-- Text displays -->
<div id="fannyText"></div>
<div id="userText"></div>

<!-- Status bar -->
<div id="statusBar">
  <div id="statusDot"></div>
  <canvas id="waveCanvas" width="120" height="32"></canvas>
  <div id="statusMsg">Waiting…</div>
</div>

<!-- Interrupt button (shows when Fanny talks) -->
<button id="interruptBtn" title="Interrupt Fanny" aria-label="Interrupt">■</button>

<div id="errMsg"></div>

<script>
const SYSTEM = `You are Fanny — a brilliantly passionate, loud, funny and opinionated Cockney football fan. You're in a pub debate about World Cup 2026. You're informal, sharp, wind people up, and love a good argument.

Personality:
- Warm but feisty. Big laughs. Don't back down. Proper Cockney: "blimey", "cor", "ain't it", "me old mucker", "you 'avin a laugh", "sorted", "proper", "gaff", "manor" etc.
- STRONG opinions on every national team — squads, managers, tactics, chances, history.
- World Cup 2026: USA/Canada/Mexico. 48 teams. Groups of 3. Favourites: Brazil, France, England, Argentina (defending), Spain, Germany.
- Current stars: Vinicius Jr, Mbappé, Bellingham, Rodri, Pedri, Salah etc.
- Never neutral. Always hot takes. Punchy — 2-3 sentences MAX.
- React naturally. Tease gently if their team is weak. Get genuinely excited for a strong side.
- If someone interrupts you, tell them off in character: "Oi! I was talkin'!" or "Excuse me, I ain't finished yet, mate!" but keep it playful.
- Occasionally ask follow-ups to keep debate going.
- NO bullet points. NO lists. Just talk like a real person.

IMPORTANT: End every reply with ONE of these tags on its own line:
[MOOD:excited] [MOOD:sceptical] [MOOD:laughing] [MOOD:furious] [MOOD:thinking] [MOOD:impressed]
If a country is mentioned for first time, also add: [TEAM:England] (use actual country name)`;

// Country colour palettes
const COUNTRY_THEMES = {
  england:    {c1:'#0a1628',c2:'#0d2040',accent:'#cf142b',pulse:'#cf142b',flag:'🏴󠁧󠁢󠁥󠁮󠁧󠁿'},
  france:     {c1:'#0a0f28',c2:'#0d1540',accent:'#ef4135',pulse:'#4169e1',flag:'🇫🇷'},
  brazil:     {c1:'#0a1a0a',c2:'#0d2a0d',accent:'#FEDD00',pulse:'#009c3b',flag:'🇧🇷'},
  germany:    {c1:'#141414',c2:'#1e1e1e',accent:'#DD0000',pulse:'#FFCE00',flag:'🇩🇪'},
  spain:      {c1:'#1a0a08',c2:'#2a100a',accent:'#c60b1e',pulse:'#f1bf00',flag:'🇪🇸'},
  argentina:  {c1:'#081828',c2:'#0a2035',accent:'#74acdf',pulse:'#74acdf',flag:'🇦🇷'},
  portugal:   {c1:'#0a1a08',c2:'#0d200a',accent:'#006600',pulse:'#ff0000',flag:'🇵🇹'},
  italy:      {c1:'#080f1a',c2:'#0a1428',accent:'#0066cc',pulse:'#009246',flag:'🇮🇹'},
  netherlands:{c1:'#1a0c00',c2:'#2a1400',accent:'#ff6600',pulse:'#ff6600',flag:'🇳🇱'},
  usa:        {c1:'#0a0f1e',c2:'#0d1428',accent:'#b22234',pulse:'#3c3b6e',flag:'🇺🇸'},
  mexico:     {c1:'#0a1a0a',c2:'#0d200d',accent:'#006847',pulse:'#ce1126',flag:'🇲🇽'},
  japan:      {c1:'#1a0a0a',c2:'#200d0d',accent:'#bc002d',pulse:'#bc002d',flag:'🇯🇵'},
  morocco:    {c1:'#0f0a00',c2:'#1a1200',accent:'#c1272d',pulse:'#006233',flag:'🇲🇦'},
  senegal:    {c1:'#0a1a08',c2:'#0d200a',accent:'#00853f',pulse:'#fcd116',flag:'🇸🇳'},
};

const DEFAULT_THEME = {c1:'#1a1f2e',c2:'#252b3d',accent:'#e8b84b',pulse:'#e8b84b'};

let history=[], isListening=false, isSpeaking=false, recognition=null;
let currentAudio=null, currentTeam=null, interruptCount=0;
let fannyTextTimeout=null, userTextTimeout=null;

const bg=document.getElementById('bg');
const pulseRing=document.getElementById('pulseRing');
const fannyWrap=document.getElementById('fannyWrap');
const fannyTextEl=document.getElementById('fannyText');
const userTextEl=document.getElementById('userText');
const statusDot=document.getElementById('statusDot');
const statusMsg=document.getElementById('statusMsg');
const moodLabel=document.getElementById('moodLabel');

const interruptBtn=document.getElementById('interruptBtn');
const errMsg=document.getElementById('errMsg');
const countryStrip=document.getElementById('countryStrip');
const countryFlag=document.getElementById('countryFlag');
const countryName=document.getElementById('countryName');

// Face elements






// ── THEME ──
function applyTheme(theme){
  const t=theme||DEFAULT_THEME;
  document.documentElement.style.setProperty('--c1',t.c1);
  document.documentElement.style.setProperty('--c2',t.c2);
  document.documentElement.style.setProperty('--accent',t.accent);
  document.documentElement.style.setProperty('--pulse',t.pulse);
  bg.style.background=`radial-gradient(ellipse at 30% 50%, ${t.c2} 0%, ${t.c1} 70%)`;
}

function setCountry(teamName){
  const key=teamName.toLowerCase().replace(/\s+/g,'');
  const theme=COUNTRY_THEMES[key];
  if(theme){
    applyTheme(theme);
    countryFlag.textContent=theme.flag||'';
    countryName.textContent=teamName.toUpperCase();
    countryStrip.classList.add('show');
    currentTeam=teamName;
  }
}

// ── STATUS ──
function setStatus(state,text){
  statusDot.className=state||'';
  statusMsg.textContent=text;
  
}

function showErr(msg,duration=6000){
  errMsg.textContent=msg;errMsg.style.display='block';
  setTimeout(()=>errMsg.style.display='none',duration);
}

// ── FACE MOODS ──
const MOODS={
  excited:{mouth:'M50 98 Q70 116 90 98',lb:'M42 57 Q52 51 63 55',rb:'M77 55 Q88 51 98 57',cheeks:.6,label:'Buzzing!'},
  sceptical:{mouth:'M54 104 Q70 100 86 104',lb:'M42 61 Q52 58 63 63',rb:'M77 63 Q88 58 98 61',cheeks:0,label:'Really though…'},
  laughing:{mouth:'M47 96 Q70 120 93 96',lb:'M42 56 Q52 50 63 54',rb:'M77 54 Q88 50 98 56',cheeks:.9,label:'Hahaha!'},
  furious:{mouth:'M54 106 Q70 98 86 106',lb:'M42 63 Q52 56 63 60',rb:'M77 60 Q88 56 98 63',cheeks:.1,label:'Outrageous!'},
  thinking:{mouth:'M57 103 Q70 106 83 102',lb:'M42 60 Q52 56 63 58',rb:'M77 56 Q88 58 98 62',cheeks:0,label:'Hmm…'},
  impressed:{mouth:'M52 99 Q70 113 88 99',lb:'M42 58 Q52 52 63 56',rb:'M77 56 Q88 52 98 58',cheeks:.4,label:'Fair play!'},
  idle:{mouth:'M54 100 Q70 114 86 100',lb:'M42 59 Q52 54 63 57',rb:'M77 57 Q88 54 98 59',cheeks:0,label:'Ready…'},
  listening:{mouth:'M58 102 Q70 108 82 102',lb:'M42 59 Q52 54 63 57',rb:'M77 57 Q88 54 98 59',cheeks:0,label:'Listening…'},
};

function setMood(mood){
  const m=MOODS[mood]||MOODS.idle;
            moodLabel.textContent=m.label;
}



// ── TEXT DISPLAY ──
function showFannyText(text){
  if(fannyTextTimeout) clearTimeout(fannyTextTimeout);
  fannyTextEl.textContent='"'+text+'"';
  fannyTextEl.classList.add('show');
  // fade out after 8s
  fannyTextTimeout=setTimeout(()=>fannyTextEl.classList.remove('show'),8000);
}

function showUserText(text,interim=false){
  userTextEl.textContent=text;
  userTextEl.classList.remove('interim');
  if(interim) userTextEl.classList.add('interim');
  userTextEl.classList.add('show');
  if(!interim){
    if(userTextTimeout) clearTimeout(userTextTimeout);
    userTextTimeout=setTimeout(()=>userTextEl.classList.remove('show'),4000);
  }
}

// ── PARSE REPLY ──
function parseReply(raw){
  const moodM=raw.match(/\[MOOD:(\w+)\]/i);
  const teamM=raw.match(/\[TEAM:([^\]]+)\]/i);
  const clean=raw.replace(/\[MOOD:[^\]]+\]/gi,'').replace(/\[TEAM:[^\]]+\]/gi,'').trim();
  return{clean, mood:(moodM?moodM[1].toLowerCase():'idle'), team:(teamM?teamM[1]:null)};
}

// ── ELEVENLABS TTS ──
async function speak(text){
  if(currentAudio){currentAudio.pause();currentAudio=null}
  isSpeaking=true;
  fannyWrap.classList.add('talking');
  pulseRing.classList.remove('listen');
  pulseRing.classList.add('active');
  interruptBtn.classList.add('show');
  setStatus('speak','Fanny is talking…');
  showFannyText(text);

  try{
    const res=await fetch('/.netlify/functions/speak',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({text})
    });
    if(!res.ok) throw new Error('TTS '+res.status);
    const data=await res.json();
    if(data.error) throw new Error(data.error);
    if(!data.audio) throw new Error('no audio');
    const bytes=Uint8Array.from(atob(data.audio),c=>c.charCodeAt(0));
    const blob=new Blob([bytes],{type:'audio/mpeg'});
    const url=URL.createObjectURL(blob);
    const audio=new Audio(url);
    currentAudio=audio;
    audio.onended=audio.onerror=()=>{
      URL.revokeObjectURL(url);currentAudio=null;
      stopWaveform();
      doneSpeak();
    };
    await audio.play();
    startWaveform(audio);
  }catch(e){
    console.warn('ElevenLabs failed:',e);
    fallbackSpeak(text);
  }
}

function fallbackSpeak(text){
  const s=window.speechSynthesis;s.cancel();
  const u=new SpeechSynthesisUtterance(text);u.rate=1.05;u.pitch=1.1;
  const vs=s.getVoices();
  const pick=vs.find(v=>/female|samantha|karen|moira/i.test(v.name)&&v.lang.startsWith('en'))||
             vs.find(v=>v.lang.startsWith('en-GB'))||vs.find(v=>v.lang.startsWith('en'));
  if(pick)u.voice=pick;
  u.onend=u.onerror=()=>doneSpeak();
  s.speak(u);
}

function doneSpeak(){
  isSpeaking=false;
  stopWaveform();
  fannyWrap.classList.remove('talking');
  pulseRing.classList.remove('active');
  interruptBtn.classList.remove('show');
  interruptCount=0;
  setStatus('listen','Listening…');
  setMood('listening');
  fannyWrap.classList.add('listening');
  startListening();
}

function interrupt(){
  interruptCount++;
  if(currentAudio){currentAudio.pause();currentAudio=null}
  window.speechSynthesis?.cancel();

  const scolds=["Oi! I was talkin'!","Excuse me, I ain't finished yet, mate!","Blimey, let me finish!","Cor, you're rude, you are!"];
  if(interruptCount>2){
    const scold=scolds[Math.floor(Math.random()*scolds.length)];
    askFanny('[interrupted] '+scold+' Anyway — '+history[history.length-1]?.content?.slice(0,40)+'...');
  } else {
    doneSpeak();
  }
}

interruptBtn.addEventListener('click',interrupt);

// ── CLAUDE API ──
async function askFanny(userMsg){
  history.push({role:'user',content:userMsg});
  setStatus('think','Fanny is thinking…');
  setMood('thinking');
  fannyWrap.classList.remove('listening');
  pulseRing.classList.remove('listen');
  stopListening();

  try{
    const res=await fetch('/.netlify/functions/chat',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({system:SYSTEM,messages:history})
    });
    const data=await res.json();
    if(!res.ok||data.error) throw new Error(data.error?.message||data.error||'API error');
    const raw=data.content?.map(b=>b.text||'').join('').trim()||"Cor blimey, lost me train of thought there!";
    const{clean,mood,team}=parseReply(raw);
    history.push({role:'assistant',content:raw});
    if(team&&!currentTeam) setCountry(team);
    setMood(mood);
    speak(clean);
  }catch(e){
    showErr(e.message,8000);
    setStatus('listen','Try again');
    setMood('idle');
    startListening();
    console.error(e);
  }
}

// ── SPEECH RECOGNITION ── (always on)
let interimTranscript='', finalTranscript='', silenceTimer=null;

function initRecognition(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){showErr('Voice not supported — use Chrome or Edge');return}
  recognition=new SR();
  recognition.continuous=true;
  recognition.interimResults=true;
  recognition.lang='en-GB';

  recognition.onresult=e=>{
    let interim='', final='';
    for(let i=e.resultIndex;i<e.results.length;i++){
      if(e.results[i].isFinal) final+=e.results[i][0].transcript;
      else interim+=e.results[i][0].transcript;
    }
    finalTranscript=(finalTranscript+final).trim();
    const live=finalTranscript+(interim?(finalTranscript?' ':'')+interim:'');

    if(live) showUserText(live, !finalTranscript);

    // If Fanny is speaking and user talks, interrupt
    if(isSpeaking && live.length>3){
      interrupt();
      return;
    }

    // Auto-send after silence
    if(finalTranscript){
      clearTimeout(silenceTimer);
      silenceTimer=setTimeout(()=>{
        const msg=finalTranscript.trim();
        if(msg&&!isSpeaking){
          showUserText(msg);
          finalTranscript='';interimTranscript='';
          askFanny(msg);
        }
      },1800);
    }
  };

  recognition.onerror=e=>{
    if(e.error==='not-allowed') showErr('Mic denied — please allow microphone access');
    else if(e.error!=='aborted'&&e.error!=='no-speech') console.warn('Mic:',e.error);
  };

  recognition.onend=()=>{
    if(isListening) try{recognition.start()}catch(_){}
  };
}

function startListening(){
  if(isListening) return;
  isListening=true;
  finalTranscript='';
  pulseRing.classList.add('listen');
  try{recognition.start()}catch(_){}
}

function stopListening(){
  isListening=false;
  pulseRing.classList.remove('listen');
  try{recognition.stop()}catch(_){}
}


// ── ORB WAVEFORM ──
let audioCtx=null, analyser=null, waveAnimId=null;
const orbCanvas=document.getElementById('orbCanvas');
const orbCtx=orbCanvas.getContext('2d');
// Keep small status canvas too
const waveCanvas=document.getElementById('waveCanvas');
const waveCtx=waveCanvas?waveCanvas.getContext('2d'):null;

function startWaveform(audioEl){
  try{
    if(!audioCtx) audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended') audioCtx.resume();
    if(!audioEl._srcNode){
      const src=audioCtx.createMediaElementSource(audioEl);
      audioEl._srcNode=src;
    }
    if(analyser){analyser.disconnect();}
    analyser=audioCtx.createAnalyser();
    analyser.fftSize=256;
    analyser.smoothingTimeConstant=0.8;
    audioEl._srcNode.connect(analyser);
    analyser.connect(audioCtx.destination);
    waveCanvas.classList.add('active');
    drawWave();
  }catch(e){
    console.warn('Waveform error:',e);
    orbCanvas.classList.add('active');
    drawFakeWave();
  }
}

function stopWaveform(){
  if(waveAnimId){cancelAnimationFrame(waveAnimId);waveAnimId=null;}
  orbCanvas.classList.remove('active');
  drawIdleOrb();
}

function drawOrb(buf, fake=false){
  const W=200, H=200, cx=100, cy=100;
  const accent=getComputedStyle(document.documentElement).getPropertyValue('--accent').trim()||'#e8b84b';
  orbCtx.clearRect(0,0,W,H);

  // Base circle
  orbCtx.beginPath();
  orbCtx.arc(cx,cy,72,0,Math.PI*2);
  orbCtx.fillStyle='rgba(0,0,0,0.35)';
  orbCtx.fill();

  // Waveform ring
  const bars=64;
  for(let i=0;i<bars;i++){
    const angle=(i/bars)*Math.PI*2 - Math.PI/2;
    let v;
    if(fake){
      v=0.2+0.6*Math.abs(Math.sin(fakePhase+i*0.2));
    } else {
      v=buf[Math.floor(i*buf.length/bars)]/255;
    }
    const inner=68;
    const outer=inner+4+v*32;
    const x1=cx+Math.cos(angle)*inner;
    const y1=cy+Math.sin(angle)*inner;
    const x2=cx+Math.cos(angle)*outer;
    const y2=cy+Math.sin(angle)*outer;
    orbCtx.beginPath();
    orbCtx.moveTo(x1,y1);
    orbCtx.lineTo(x2,y2);
    orbCtx.strokeStyle=accent;
    orbCtx.globalAlpha=0.3+v*0.7;
    orbCtx.lineWidth=2.5;
    orbCtx.stroke();
  }
  orbCtx.globalAlpha=1;

  // Outer glow ring
  orbCtx.beginPath();
  orbCtx.arc(cx,cy,70,0,Math.PI*2);
  orbCtx.strokeStyle=accent;
  orbCtx.globalAlpha=0.15;
  orbCtx.lineWidth=1;
  orbCtx.stroke();
  orbCtx.globalAlpha=1;
}

function drawIdleOrb(){
  const W=200,H=200,cx=100,cy=100;
  const accent=getComputedStyle(document.documentElement).getPropertyValue('--accent').trim()||'#e8b84b';
  orbCtx.clearRect(0,0,W,H);
  orbCtx.beginPath();
  orbCtx.arc(cx,cy,72,0,Math.PI*2);
  orbCtx.fillStyle='rgba(0,0,0,0.35)';
  orbCtx.fill();
  orbCtx.beginPath();
  orbCtx.arc(cx,cy,70,0,Math.PI*2);
  orbCtx.strokeStyle=accent;
  orbCtx.globalAlpha=0.2;
  orbCtx.lineWidth=1.5;
  orbCtx.stroke();
  orbCtx.globalAlpha=1;
}
drawIdleOrb();

function drawWave(){
  waveAnimId=requestAnimationFrame(drawWave);
  const buf=new Uint8Array(analyser.frequencyBinCount);
  analyser.getByteFrequencyData(buf);
  drawOrb(buf,false);
}

let fakePhase=0;
function drawFakeWave(){
  waveAnimId=requestAnimationFrame(drawFakeWave);
  fakePhase+=0.05;
  drawOrb(null,true);
}

// ── BOOT ──
document.getElementById('startBtn').addEventListener('click',async()=>{
  const intro=document.getElementById('intro');
  intro.classList.add('fade');
  setTimeout(()=>intro.style.display='none',800);

  setStatus('think','Waking Fanny up…');
  setMood('idle');
  initRecognition();

  try{
    const res=await fetch('/.netlify/functions/chat',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({system:SYSTEM,messages:[{role:'user',content:"Start the debate. Say hi like we're in a pub. Introduce yourself as Fanny very briefly. Ask what country I'm supporting this summer. Max 2 sentences, proper Cockney."}]})
    });
    const data=await res.json();
    const raw=data.content?.map(b=>b.text||'').join('').trim()||"Alright, pull up a pew! I'm Fanny — cor, what a summer it's gonna be. So go on then, who you backin'?";
    const{clean,mood}=parseReply(raw);
    history.push({role:'assistant',content:raw});
    setMood(mood||'excited');
    speak(clean);
  }catch(e){
    showErr(e.message,8000);
    const fallback="Alright, pull up a pew! I'm Fanny — cor, what a summer it's gonna be. So go on then, who you backin'?";
    history.push({role:'assistant',content:fallback});
    setMood('excited');
    speak(fallback);
    console.error(e);
  }
});
</script>
