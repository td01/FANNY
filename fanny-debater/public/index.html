<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fanny — Football Fan Debater</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --gold: #c8a227;
    --gold-dim: #c8a22722;
    --bg: #0a0f1e;
    --bg-panel: #0d1425;
    --bg-card: #111827;
    --bg-bubble-fanny: #141f33;
    --bg-bubble-user: #1a3352;
    --border: #1e2a3a;
    --text: #f0ede4;
    --text-dim: #888;
    --text-bubble: #e8e4d8;
    --text-user-bubble: #c8dff0;
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
  }

  body {
    display: flex;
    flex-direction: column;
    height: 100dvh;
    overflow: hidden;
  }

  /* ── Header ── */
  header {
    background: var(--bg-panel);
    border-bottom: 2px solid var(--gold);
    padding: 10px 20px;
    display: flex;
    align-items: center;
    gap: 14px;
    flex-shrink: 0;
  }

  .logo-ball {
    width: 44px; height: 44px;
    background: var(--gold);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 24px;
    flex-shrink: 0;
  }

  .logo-text h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 28px;
    letter-spacing: 3px;
    color: var(--gold);
    line-height: 1;
  }

  .logo-text p {
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-top: 2px;
  }

  /* ── Status bar ── */
  .status-bar {
    background: #090e1b;
    padding: 5px 20px;
    display: flex;
    align-items: center;
    gap: 8px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: #2d3a2d;
    flex-shrink: 0;
    transition: background 0.3s;
  }
  .dot.ready   { background: #3dba4e; }
  .dot.listen  { background: var(--gold); animation: blink .8s infinite; }
  .dot.think   { background: #9b6ede; animation: blink 1.2s infinite; }
  .dot.speak   { background: #4a9ede; animation: blink 1s infinite; }

  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }

  #statusText {
    font-size: 12px;
    color: var(--text-dim);
    letter-spacing: .5px;
  }

  /* ── Chat ── */
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 18px 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    scroll-behavior: smooth;
  }

  #chat::-webkit-scrollbar { width: 4px; }
  #chat::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  .msg {
    display: flex;
    gap: 10px;
    align-items: flex-end;
    animation: rise .3s ease;
    max-width: 85%;
  }

  @keyframes rise { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:none} }

  .msg.user { align-self: flex-end; flex-direction: row-reverse; }
  .msg.fanny { align-self: flex-start; }

  .av {
    width: 34px; height: 34px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 12px;
    letter-spacing: 1px;
    flex-shrink: 0;
  }

  .av.fanny { background: var(--gold); color: var(--bg); }
  .av.user  { background: #1e3a5a; color: #7ab4de; }

  .bubble {
    padding: 11px 16px;
    border-radius: 18px;
    font-size: 14.5px;
    line-height: 1.6;
  }

  .msg.fanny .bubble {
    background: var(--bg-bubble-fanny);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
    color: var(--text-bubble);
  }

  .msg.user .bubble {
    background: var(--bg-bubble-user);
    border: 1px solid #254a6e;
    border-bottom-right-radius: 4px;
    color: var(--text-user-bubble);
  }

  /* Typing indicator */
  .typing-bubble {
    display: flex; align-items: center; gap: 6px;
    padding: 14px 18px;
    background: var(--bg-bubble-fanny);
    border: 1px solid var(--border);
    border-radius: 18px;
    border-bottom-left-radius: 4px;
  }

  .td {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--gold);
    animation: bounce 1.2s infinite;
  }
  .td:nth-child(2) { animation-delay: .2s; }
  .td:nth-child(3) { animation-delay: .4s; }

  @keyframes bounce { 0%,60%,100%{transform:translateY(0)} 30%{transform:translateY(-7px)} }

  /* ── Controls ── */
  .controls {
    background: var(--bg-panel);
    border-top: 1px solid var(--border);
    padding: 14px 20px 18px;
    flex-shrink: 0;
  }

  .input-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .mic-btn {
    width: 54px; height: 54px;
    border-radius: 50%;
    border: 2px solid var(--gold);
    background: transparent;
    color: var(--gold);
    font-size: 24px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background .2s, transform .1s;
    flex-shrink: 0;
  }

  .mic-btn:hover:not(:disabled) { background: var(--gold-dim); }
  .mic-btn:active:not(:disabled) { transform: scale(.95); }

  .mic-btn.on {
    background: var(--gold);
    color: var(--bg);
    animation: micring 1s infinite;
  }

  .mic-btn:disabled { border-color: #2a2a2a; color: #2a2a2a; cursor: not-allowed; }

  @keyframes micring {
    0%,100% { box-shadow: 0 0 0 0 #c8a22755; }
    50%      { box-shadow: 0 0 0 12px #c8a22700; }
  }

  .transcript {
    flex: 1;
    min-height: 48px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px 14px;
    font-size: 14px;
    line-height: 1.5;
    color: var(--text-dim);
    font-style: italic;
    display: flex;
    align-items: center;
    cursor: default;
    word-break: break-word;
  }

  .transcript.live {
    border-color: #c8a22755;
    color: var(--text);
    font-style: normal;
  }

  .send-btn {
    height: 48px;
    padding: 0 22px;
    background: var(--gold);
    border: none;
    border-radius: 12px;
    color: var(--bg);
    font-family: 'Bebas Neue', sans-serif;
    font-size: 18px;
    letter-spacing: 2px;
    cursor: pointer;
    transition: opacity .2s, transform .1s;
    flex-shrink: 0;
  }

  .send-btn:hover:not(:disabled) { opacity: .88; }
  .send-btn:active:not(:disabled) { transform: scale(.97); }
  .send-btn:disabled { opacity: .25; cursor: not-allowed; }

  .hint {
    font-size: 11.5px;
    color: #3a4a5a;
    text-align: center;
    margin-top: 10px;
    letter-spacing: .4px;
  }

  .error {
    background: #1e0a0a;
    border: 1px solid #5a1e1e;
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 12.5px;
    color: #e06060;
    margin-top: 10px;
    display: none;
  }

  /* ── Responsive ── */
  @media (max-width: 480px) {
    header { padding: 8px 14px; gap: 10px; }
    .logo-text h1 { font-size: 22px; }
    #chat { padding: 12px 12px; }
    .controls { padding: 10px 12px 14px; }
    .msg { max-width: 92%; }
    .send-btn { padding: 0 14px; font-size: 16px; }
  }
</style>
</head>
<body>

<header>
  <div class="logo-ball">⚽</div>
  <div class="logo-text">
    <h1>Fanny</h1>
    <p>Football Fan Debater · World Cup 2026</p>
  </div>
</header>

<div class="status-bar">
  <div class="dot" id="dot"></div>
  <span id="statusText">Starting up…</span>
</div>

<div id="chat" role="log" aria-live="polite" aria-label="Debate conversation"></div>

<div class="controls">
  <div class="input-row">
    <button class="mic-btn" id="micBtn" aria-label="Toggle microphone" disabled>
      <i class="ti ti-microphone" aria-hidden="true"></i>
    </button>
    <div class="transcript" id="transcript" aria-live="polite">
      <span id="transcriptText">Press the mic and start talking…</span>
    </div>
    <button class="send-btn" id="sendBtn" disabled aria-label="Send message">SEND</button>
  </div>
  <div class="error" id="errorBox"></div>
  <p class="hint" id="hint">🎙️ Tap the mic · speak · tap again · then SEND</p>
</div>

<script>
const SYSTEM = `You are Fanny — a brilliantly passionate, loud, funny and opinionated football fan AI. You're in a pub debate about World Cup 2026. You're informal, sharp, occasionally winding people up, and you love a good argument.

Your personality:
- Warm but feisty. Big laughs. Don't back down.
- Pub-chat language: "mate", "look", "right", "come on", "honestly", "tell you what", "you're having a laugh", "absolutely no chance", "dark horse this", etc.
- STRONG opinions on every national team — squads, managers, tactics, chances, history, key players, weak spots.
- World Cup 2026 knowledge: hosted by USA, Canada & Mexico. First 48-team tournament. Groups of 3 teams, top 2 go through. Favourites include Brazil, France, England, Argentina (defending champions), Spain, Germany.
- You know current football: star players like Vinicius Jr, Mbappé, Bellingham, Rodri, Pedri, Lewandowski, Haaland (Norway — not qualified, which is a talking point), Messi (retired from internationals now), Salah, etc.
- Never neutral. Always have a hot take.
- Punchy replies — 2 to 4 sentences max. Like a real pub chat.
- React naturally to what they say. Tease gently if their team is iffy. Get genuinely excited if they've picked a good side.
- Occasionally ask them a follow-up question to keep the debate going — "Who do you reckon their best player is?", "Do you think they'll even get out the group?", "What's your prediction for the final?"
- NO bullet points. NO lists. Just talk.`;

let history = [];
let transcript = '';
let isListening = false;
let isSpeaking = false;
let recognition = null;

const chat     = document.getElementById('chat');
const dot      = document.getElementById('dot');
const statusTx = document.getElementById('statusText');
const micBtn   = document.getElementById('micBtn');
const sendBtn  = document.getElementById('sendBtn');
const trBox    = document.getElementById('transcript');
const trText   = document.getElementById('transcriptText');
const errorBox = document.getElementById('errorBox');
const hint     = document.getElementById('hint');

/* ── Utilities ── */
function setStatus(state, text) {
  dot.className = 'dot' + (state ? ' ' + state : '');
  statusTx.textContent = text;
}

function showError(msg) {
  errorBox.textContent = msg;
  errorBox.style.display = 'block';
  setTimeout(() => errorBox.style.display = 'none', 6000);
}

function scrollBottom() {
  chat.scrollTop = chat.scrollHeight;
}

/* ── Message rendering ── */
function addMsg(role, text) {
  const wrap = document.createElement('div');
  wrap.className = `msg ${role}`;

  const av = document.createElement('div');
  av.className = `av ${role}`;
  av.textContent = role === 'fanny' ? 'FAN' : 'YOU';
  av.setAttribute('aria-hidden', 'true');

  const bub = document.createElement('div');
  bub.className = 'bubble';
  bub.textContent = text;

  wrap.appendChild(av);
  wrap.appendChild(bub);
  chat.appendChild(wrap);
  scrollBottom();
  return wrap;
}

function addTyping() {
  const wrap = document.createElement('div');
  wrap.className = 'msg fanny';
  wrap.id = 'typing';

  const av = document.createElement('div');
  av.className = 'av fanny';
  av.textContent = 'FAN';
  av.setAttribute('aria-hidden', 'true');

  const bub = document.createElement('div');
  bub.className = 'typing-bubble';
  bub.innerHTML = '<div class="td"></div><div class="td"></div><div class="td"></div>';

  wrap.appendChild(av);
  wrap.appendChild(bub);
  chat.appendChild(wrap);
  scrollBottom();
}

function removeTyping() {
  const el = document.getElementById('typing');
  if (el) el.remove();
}

/* ── Speech synthesis — ElevenLabs ── */
let currentAudio = null;

async function speak(text) {
  // Stop anything currently playing
  if (currentAudio) {
    currentAudio.pause();
    currentAudio = null;
  }

  isSpeaking = true;
  setStatus('speak', 'Fanny is talking…');
  micBtn.disabled = true;

  try {
    const res = await fetch('/api/speak', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text }),
    });

    if (!res.ok) throw new Error('TTS fetch failed: ' + res.status);

    const data = await res.json();
    if (!data.audio) throw new Error('No audio returned');

    // Decode base64 → Blob → Object URL → play
    const bytes = Uint8Array.from(atob(data.audio), c => c.charCodeAt(0));
    const blob = new Blob([bytes], { type: 'audio/mpeg' });
    const url = URL.createObjectURL(blob);

    const audio = new Audio(url);
    currentAudio = audio;

    audio.onended = () => {
      URL.revokeObjectURL(url);
      currentAudio = null;
      isSpeaking = false;
      micBtn.disabled = false;
      setStatus('ready', 'Your turn');
      hint.textContent = '🎙️ Tap the mic · speak · tap again · then SEND';
    };

    audio.onerror = () => {
      console.warn('Audio playback error, falling back to browser TTS');
      fallbackSpeak(text);
    };

    await audio.play();

  } catch (err) {
    console.warn('ElevenLabs TTS failed, falling back:', err);
    fallbackSpeak(text);
  }
}

function fallbackSpeak(text) {
  const synth = window.speechSynthesis;
  synth.cancel();
  const utt = new SpeechSynthesisUtterance(text);
  utt.rate = 1.05; utt.pitch = 1.1;
  const voices = synth.getVoices();
  const pick = voices.find(v => v.lang.startsWith('en-GB')) || voices.find(v => v.lang.startsWith('en'));
  if (pick) utt.voice = pick;
  utt.onend = utt.onerror = () => {
    isSpeaking = false;
    micBtn.disabled = false;
    setStatus('ready', 'Your turn');
    hint.textContent = '🎙️ Tap the mic · speak · tap again · then SEND';
  };
  synth.speak(utt);
}

/* ── Claude API ── */
async function askFanny(userMsg) {
  history.push({ role: 'user', content: userMsg });
  addTyping();
  setStatus('think', 'Fanny is thinking…');
  micBtn.disabled = true;
  sendBtn.disabled = true;

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ system: SYSTEM, messages: history }),
    });

    const data = await res.json();

    if (!res.ok || data.error) {
      throw new Error(data.error?.message || data.error || 'API error');
    }

    const reply = data.content?.map(b => b.text || '').join('').trim()
      || "Oi, I lost my train of thought — go on, say that again!";

    history.push({ role: 'assistant', content: reply });
    removeTyping();
    addMsg('fanny', reply);
    speak(reply);

  } catch (err) {
    removeTyping();
    showError('Something went wrong: ' + err.message);
    setStatus('ready', 'Ready');
    micBtn.disabled = false;
    console.error(err);
  }
}

/* ── Speech recognition ── */
function initRecognition() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    showError('Voice not supported in this browser. Use Chrome or Edge.');
    micBtn.disabled = true;
    hint.textContent = '⚠️ No voice support detected — try Chrome or Edge';
    return;
  }

  recognition = new SR();
  recognition.continuous = true;
  recognition.interimResults = true;
  recognition.lang = 'en-GB';

  recognition.onresult = (e) => {
    let interim = '';
    let final = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      if (e.results[i].isFinal) final += e.results[i][0].transcript;
      else interim += e.results[i][0].transcript;
    }
    transcript = (transcript + final).trim();
    const live = transcript + (interim ? (transcript ? ' ' : '') + interim : '');
    trText.textContent = live || 'Listening…';
    trBox.classList.toggle('live', !!live);
    sendBtn.disabled = !transcript;
  };

  recognition.onerror = (e) => {
    if (e.error === 'not-allowed') {
      showError('Microphone access denied. Allow mic access in your browser and refresh.');
    } else if (e.error !== 'aborted' && e.error !== 'no-speech') {
      showError('Mic error: ' + e.error);
    }
    stopListening();
  };

  recognition.onend = () => {
    if (isListening) {
      try { recognition.start(); } catch (_) {}
    }
  };

  micBtn.disabled = false;
}

function startListening() {
  if (isSpeaking) synth.cancel();
  transcript = '';
  trText.textContent = 'Listening…';
  trBox.classList.remove('live');
  isListening = true;
  micBtn.classList.add('on');
  micBtn.innerHTML = '<i class="ti ti-microphone-off" aria-hidden="true"></i>';
  micBtn.setAttribute('aria-label', 'Stop recording');
  sendBtn.disabled = true;
  setStatus('listen', 'Listening…');
  hint.textContent = '🔴 Recording — tap mic again to stop';
  try { recognition.start(); } catch (_) {}
}

function stopListening() {
  isListening = false;
  micBtn.classList.remove('on');
  micBtn.innerHTML = '<i class="ti ti-microphone" aria-hidden="true"></i>';
  micBtn.setAttribute('aria-label', 'Start recording');
  try { recognition.stop(); } catch (_) {}
  setStatus('ready', 'Ready');

  if (transcript.trim()) {
    sendBtn.disabled = false;
    hint.textContent = '✅ Tap SEND to argue back at Fanny';
  } else {
    trText.textContent = 'Press the mic and start talking…';
    trBox.classList.remove('live');
    hint.textContent = '🎙️ Tap the mic · speak · tap again · then SEND';
  }
}

micBtn.addEventListener('click', () => {
  if (micBtn.disabled) return;
  if (isListening) stopListening();
  else startListening();
});

sendBtn.addEventListener('click', () => {
  const msg = transcript.trim();
  if (!msg) return;
  addMsg('user', msg);
  trText.textContent = 'Press the mic and start talking…';
  trBox.classList.remove('live');
  transcript = '';
  sendBtn.disabled = true;
  hint.textContent = '⏳ Fanny is cooking up a response…';
  askFanny(msg);
});

/* ── Boot ── */
async function boot() {
  setStatus('', 'Starting up…');
  addTyping();

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        system: SYSTEM,
        messages: [{ role: 'user', content: "Start the debate. Greet me like we're in a pub, introduce yourself briefly as Fanny, then ask me what country I'm supporting this summer. Keep it short and punchy." }]
      }),
    });
    const data = await res.json();
    const reply = data.content?.map(b => b.text || '').join('').trim()
      || "Right then! Pull up a stool — I'm Fanny, and I've got opinions. So go on… what country are you backing this summer?";

    history.push({ role: 'assistant', content: reply });
    removeTyping();
    addMsg('fanny', reply);
    setStatus('ready', 'Ready');
    initRecognition();
    speak(reply);

  } catch (err) {
    removeTyping();
    const fallback = "Right then! Pull up a stool — I'm Fanny, and I've got opinions. So go on… what country are you backing this summer?";
    history.push({ role: 'assistant', content: fallback });
    addMsg('fanny', fallback);
    setStatus('ready', 'Ready');
    initRecognition();
    speak(fallback);
    console.warn('Boot fetch failed, using fallback:', err);
  }
}

setTimeout(boot, 300);
</script>
</body>
</html>
